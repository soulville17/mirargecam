appId: com.mirargecam.desktop
productName: MirageCam
copyright: Copyright (c) MirageCam
directories:
  output: dist
  buildResources: electron/build
files:
  - electron/**/*
  - .next/**/*
  - public/**/*
  - package.json
extraResources:
  - from: resources/akvirtualcamera
    to: akvirtualcamera
    filter:
      - "**/*"
win:
  target:
    - nsis
  requestedExecutionLevel: requireAdministrator
  artifactName: MirageCam-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MirageCam
  include: electron/build/installer.nsh
mac:
  target:
    - dmg
  category: public.app-category.video
linux:
  target:
    - AppImage
  category: Video